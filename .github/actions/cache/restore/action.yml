name: 'High-Speed Cache Restore'
description: 'Restores directories from GitHub Releases cache buckets'

inputs:
  cache_path:
    description: 'Directory path to restore to'
    required: true
  cache_key:
    description: 'Cache key prefix'
    required: true
  cache_bucket:
    description: 'Bucket name (used for tag categorization)'
    required: false
    default: 'general-cache'
  github_token:
    description: 'GitHub Token'
    required: true

outputs:
  cache-hit:
    description: 'Whether a cache was found'
    value: ${{ steps.restore.outputs.hit }}

runs:
  using: "composite"
  steps:
    - name: Restore and Extract
      id: restore
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        
        PATH_TO_RESTORE="${{ inputs.cache_path }}"
        CACHE_KEY="${{ inputs.cache_key }}"
        BUCKET="${{ inputs.cache_bucket }}"
        
        # Use bucket in tag name to avoid collision if keys are same across buckets
        TAG_NAME="${BUCKET}"
        ARCHIVE_NAME="cache-${CACHE_KEY}.tar.zst"
        ARCHIVE_NAME_UNCOMPRESSED="cache-${CACHE_KEY}.tar"
        
        echo "::group::Restoring Cache: $CACHE_KEY from $BUCKET"
        
        # 1. Check if release exists
        if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "Cache bucket $TAG_NAME not found."
          echo "::endgroup::"
          exit 0
        fi
        
        # 2. Download assets using aria2c for speed
        echo "Fetching asset list..."
        # We look for the specific archive in the bucket
        ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/"$TAG_NAME" --jq '.assets[].name')
        
        if ! echo "$ASSETS" | grep -q "^cache-${CACHE_KEY}\.tar"; then
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "Archive $CACHE_KEY not found in bucket $TAG_NAME."
          echo "::endgroup::"
          exit 0
        fi
        
        if echo "$ASSETS" | grep -q "^${ARCHIVE_NAME}$"; then
          ARCHIVE_TO_DOWNLOAD="$ARCHIVE_NAME"
        else
          ARCHIVE_TO_DOWNLOAD="$ARCHIVE_NAME_UNCOMPRESSED"
        fi
        
        mkdir -p "$(dirname "$PATH_TO_RESTORE")"
        
        # Check if it's a split archive
        if echo "$ASSETS" | grep -q "${ARCHIVE_TO_DOWNLOAD}.part"; then
          echo "Detected split archive. Downloading parts..."
          for part in $(echo "$ASSETS" | grep "${ARCHIVE_TO_DOWNLOAD}.part" | sort | tr '\n' ' '); do
            gh release download "$TAG_NAME" -p "$part" --clobber
          done
          echo "Reassembling archive..."
          cat "${ARCHIVE_TO_DOWNLOAD}.part"* > "$ARCHIVE_TO_DOWNLOAD"
          rm "${ARCHIVE_TO_DOWNLOAD}.part"*
        else
          echo "Downloading $ARCHIVE_TO_DOWNLOAD..."
          gh release download "$TAG_NAME" -p "$ARCHIVE_TO_DOWNLOAD" --clobber
        fi
        
        # 3. Extract
        echo "Extracting archive..."
        if [[ "$ARCHIVE_TO_DOWNLOAD" == *.tar.zst ]]; then
          tar --use-compress-program="zstd -d -T0" -xf "$ARCHIVE_TO_DOWNLOAD" -C "$(dirname "$PATH_TO_RESTORE")"
        else
          tar -xf "$ARCHIVE_TO_DOWNLOAD" -C "$(dirname "$PATH_TO_RESTORE")"
        fi
        rm "$ARCHIVE_TO_DOWNLOAD"
        
        echo "hit=true" >> "$GITHUB_OUTPUT"
        echo " Cache restored successfully"
        echo "::endgroup::"
