name: 📢 Telegram on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to notify (e.g., v2.0.6)'
        required: false
        type: string
  workflow_call:

jobs:
  notify:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: Send message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROUP_ID: ${{ secrets.TELEGRAM_GROUP }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL }}
          REL_NAME: ${{ github.event.release.name || '' }}
          REL_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || '' }}
          REL_URL: ${{ github.event.release.html_url || '' }}
          REL_BODY: ${{ github.event.release.body || '' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Handle manual trigger or missing data
          if [ -z "$REL_NAME" ] && [ -n "$REL_TAG" ]; then
            echo "Manual trigger for tag: $REL_TAG"
            RELEASE_DATA=$(gh release view "$REL_TAG" --json name,body,url --repo "$REPO")
            REL_NAME=$(echo "$RELEASE_DATA" | jq -r .name)
            REL_BODY=$(echo "$RELEASE_DATA" | jq -r .body)
            REL_URL=$(echo "$RELEASE_DATA" | jq -r .url)
          fi

          if [ -z "$REL_TAG" ]; then
            echo "Error: No release tag provided and no release event data found."
            exit 1
          fi

          # Set message type
          EMOJI="🚀"
          STATUS="New Release Published"
          if [[ "${{ github.event.action }}" == "edited" ]]; then
            EMOJI="✏️"
            STATUS="Release Notes Updated"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EMOJI="📢"
            STATUS="Manual Notification"
          fi

          # ── Extract SUSFS version from release tag (e.g. v2.2.0-r1 → v2.2.0) ──
          SUSFS_VER=$(echo "$REL_TAG" | sed 's/-r[0-9]*$//')
          if [ -z "$SUSFS_VER" ]; then SUSFS_VER="latest"; fi

          # ── Extract Features from the release body ──
          # The release body has a "✨ Features & Capabilities" table with rows like:
          # | 🔐 **KernelSU-Next** | Next-generation kernel-level root solution |
          FEATURES_RAW=$(echo "$REL_BODY" | awk '
            /^## ✨ Features/ { flag=1; next }
            flag && /^\|:---/ { next }
            flag && /^\| .+\|/ {
              # Strip leading/trailing pipes and whitespace
              gsub(/^\| */, ""); gsub(/ *\| *$/, "")
              # Split by pipe separator
              split($0, parts, / *\| */)
              emoji_name = parts[1]
              desc = parts[2]
              # Remove bold markers
              gsub(/\*\*/, "", emoji_name)
              # Remove backtick markers
              gsub(/`/, "", emoji_name)
              printf "- %s: %s\n", emoji_name, desc
            }
            flag && /^---/ { flag=0 }
            flag && /^$/ { next }
            flag && /^</ { flag=0 }
          ')

          if [ -n "$FEATURES_RAW" ]; then
            # Group features into categories for a clean Telegram message
            VARIANTS=""
            NETWORK=""
            ADVANCED=""
            SECURITY=""
            OPTIMIZATION=""

            while IFS= read -r line; do
              case "$line" in
                *KernelSU*|*SUSFS*)
                  feat_name=$(echo "$line" | sed 's/^- [^ ]* //' | cut -d: -f1)
                  VARIANTS="${VARIANTS}    - ${feat_name}\n" ;;
                *BBR*|*WireGuard*|*TTL*|*IP.Set*)
                  feat_name=$(echo "$line" | sed 's/^- [^ ]* //' | cut -d: -f1)
                  NETWORK="${NETWORK}, ${feat_name}" ;;
                *Droidspaces*|*NTSync*|*HMBIRD*|*TMPFS*)
                  feat_name=$(echo "$line" | sed 's/^- [^ ]* //' | cut -d: -f1)
                  ADVANCED="${ADVANCED}, ${feat_name}" ;;
                *BBG*|*Manual.Hooks*|*Unicode*)
                  feat_name=$(echo "$line" | sed 's/^- [^ ]* //' | cut -d: -f1)
                  SECURITY="${SECURITY}, ${feat_name}" ;;
                *LTO*|*Optimization*|*Battery*)
                  feat_name=$(echo "$line" | sed 's/^- [^ ]* //' | cut -d: -f1)
                  OPTIMIZATION="${OPTIMIZATION}, ${feat_name}" ;;
              esac
            done <<< "$FEATURES_RAW"

            # Clean up leading commas/spaces
            NETWORK=$(echo "$NETWORK" | sed 's/^, //')
            ADVANCED=$(echo "$ADVANCED" | sed 's/^, //')
            SECURITY=$(echo "$SECURITY" | sed 's/^, //')
            OPTIMIZATION=$(echo "$OPTIMIZATION" | sed 's/^, //')

            FEATURES_BLOCK="Features:
          - Integrated: KernelSU-Next & SUSFS
          - Optimized for performance and battery life (${OPTIMIZATION:-LTO, Optimization, Battery})
          - Network features (${NETWORK:-BBRv3, TTL Target Support, WireGuard})
          - Advanced features (${ADVANCED:-Droidspaces, NTSync, HMBIRD SCX, TMPFS XATTR})
          - Enhanced security (${SECURITY:-BBG})"
          else
            # Fallback: hardcoded features if extraction fails
            FEATURES_BLOCK="Features:
          - Integrated: KernelSU-Next & SUSFS
          - Optimized for performance and battery life (LTO, Optimization, Battery)
          - Network features (BBRv3, TTL Target Support, WireGuard)
          - Advanced features (Droidspaces, NTSync, HMBIRD SCX, TMPFS XATTR)
          - Enhanced security (BBG)"
          fi

          # ── Changelog: read from changelog.txt (committed in repo) ──
          if [ -f "changelog.txt" ] && [ -s "changelog.txt" ]; then
            CLEAN_CHANGELOG=$(cat changelog.txt)
          else
            # Fallback: extract from release body under 'This Release'
            CLEAN_CHANGELOG=$(echo "$REL_BODY" | awk '/^### This Release/ {flag=1; next} /^### Previous Releases/ || /^---/ || /^## / {flag=0} flag && /^- /')
          fi
          if [ -z "$CLEAN_CHANGELOG" ]; then CLEAN_CHANGELOG="- Minor updates and under the hood improvements"; fi
          if [[ ${#CLEAN_CHANGELOG} -gt 2500 ]]; then CLEAN_CHANGELOG="${CLEAN_CHANGELOG:0:2500}... (truncated)"; fi

          # ── HTML Entity Escaping for Telegram HTML parse_mode ──
          # Telegram HTML requires <, >, and & to be escaped as &lt;, &gt;, &amp; even inside <pre><code>
          escape_html() {
            python3 -c "import sys, html; sys.stdout.write(html.escape(sys.stdin.read(), quote=False))"
          }

          REL_TAG_ESC=$(echo -n "$REL_TAG" | escape_html)
          REL_NAME_ESC=$(echo -n "$REL_NAME" | escape_html)
          FEATURES_BLOCK_ESC=$(echo -n "$FEATURES_BLOCK" | escape_html)
          CLEAN_CHANGELOG_ESC=$(echo -n "$CLEAN_CHANGELOG" | escape_html)
          REL_URL_ESC=$(python3 -c "import sys, html; sys.stdout.write(html.escape(sys.stdin.read().strip(), quote=True))" <<< "$REL_URL")

          # Build message (HTML formatted)
          MESSAGE=$(cat <<EOF
<b>$EMOJI $STATUS</b>

<pre><code class="language-markdown">Kernel Name: OnePlus Kernels with KSUN &amp; SUSFS
Version / Tag: $REL_TAG_ESC
Title: $REL_NAME_ESC
Device: Any supported OnePlus device (Check GitHub for your device)

$FEATURES_BLOCK_ESC

Changelog:
$CLEAN_CHANGELOG_ESC</code></pre>

<b>Important:</b>
- Flash via Kernel Flasher (for KernelSU/Next) or FKM.
- If you run into issues, please provide logs in the GitHub repository.
- Support the development by leaving a 🌟 on GitHub!

🔗 <a href="$REL_URL_ESC">Download Release on GitHub</a>
EOF
          )

          send_telegram() {
            local chat_id="$1"
            if [ -n "$chat_id" ]; then
              echo "Sending to $chat_id..."
              RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$chat_id" \
                --data-urlencode "text=$MESSAGE" \
                --data-urlencode "parse_mode=HTML")
              echo "Response: $RESPONSE"

              if ! echo "$RESPONSE" | grep -q '"ok":true'; then
                echo "Warning: HTML message sending failed for $chat_id. Retrying with plain text fallback..."
                FALLBACK_MSG=$(echo "$MESSAGE" | python3 -c "
import html, re, sys
raw = sys.stdin.read()
clean = re.sub(r'<[^>]+>', '', raw)
sys.stdout.write(html.unescape(clean))
")
                FB_RESP=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                  --data-urlencode "chat_id=$chat_id" \
                  --data-urlencode "text=$FALLBACK_MSG")
                echo "Fallback response: $FB_RESP"
                if ! echo "$FB_RESP" | grep -q '"ok":true'; then
                  echo "::error::Telegram notification failed for $chat_id: $FB_RESP"
                  exit 1
                fi
              fi
            else
              echo "Warning: Chat ID missing"
            fi
          }

          send_telegram "$GROUP_ID"
          send_telegram "$CHANNEL_ID"
