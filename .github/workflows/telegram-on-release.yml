name: 📢 Telegram on Release

'on':
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to notify (e.g., v3.0.1-Beta)'
        required: false
        type: string
  workflow_call:

jobs:
  notify:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: Send message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROUP_ID: ${{ secrets.TELEGRAM_GROUP }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL }}
          REL_NAME: ${{ github.event.release.name || '' }}
          REL_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag || '' }}
          REL_URL: ${{ github.event.release.html_url || '' }}
          REL_BODY: ${{ github.event.release.body || '' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_NAME: ${{ github.event_name || '' }}
        run: python3 scripts/notify_telegram.py
